  <rect x="35" y="210" width="30" height="120" fill="#FF6B6B" stroke="#3B2A4A" stroke-width="8" rx="15" />
  <rect x="191" y="210" width="30" height="120" fill="#FF6B6B" stroke="#3B2A4A" stroke-width="8" rx="15" />

