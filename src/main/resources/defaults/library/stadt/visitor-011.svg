  <rect x="141" y="420" width="30" height="92" rx="15" fill="#4A3728" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Coat Body -->
  <path d="M60 180 Q60 160 80 160 L176 160 Q196 160 196 180 L205 430 Q205 450 185 450 L71 450 Q51 450 51 430 Z" fill="#8B5A2B" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Arms -->
  <rect x="40" y="190" width="35" height="150" rx="17" fill="#8B5A2B" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" transform="rotate(10 40 190)" />
  <rect x="181" y="190" width="35" height="150" rx="17" fill="#8B5A2B" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" transform="rotate(-10 216 190)" />

