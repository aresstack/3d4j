  <circle cx="160" cy="220" r="12" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  <circle cx="160" cy="220" r="4" fill="#FFFFE0" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />

