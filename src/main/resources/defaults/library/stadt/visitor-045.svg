  <circle cx="110" cy="115" r="8" fill="#C04040" /> <!-- Hair highlight -->

  <!-- Face -->
  <circle cx="118" cy="150" r="4" fill="#3B2A4A" />
  <circle cx="138" cy="150" r="4" fill="#3B2A4A" />
  <path d="M120 165 Q128 175 136 165" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
