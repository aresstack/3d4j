<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Shoes -->
  <rect x="80" y="470" width="45" height="42" rx="15" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="131" y="470" width="45" height="42" rx="15" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Legs/Pants -->
  <rect x="90" y="360" width="35" height="120" rx="10" fill="#4682B4" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="131" y="360" width="35" height="120" rx="10" fill="#4682B4" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Hoodie Body -->
  <rect x="70" y="220" width="116" height="160" rx="30" fill="#9370DB" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Hoodie Sleeves -->
  <rect x="50" y="220" width="30" height="130" rx="15" fill="#9370DB" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="176" y="220" width="30" height="130" rx="15" fill="#9370DB" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

