  <!-- Head -->
  <ellipse cx="235" cy="230" rx="35" ry="25" fill="#C5E063" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Eye -->
  <circle cx="245" cy="225" r="6" fill="#3B2A4A" />
  <circle cx="247" cy="223" r="2" fill="white" />
  
  <!-- Head Highlight -->
  <path d="M 240 215 Q 250 215 255 225" fill="none" stroke="#E2F0B5" stroke-width="4" stroke-linecap="round" />
