  <path d="M 80 350 Q 30 380 40 512 Q 90 490 100 360 Z" fill="#C5E063" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Front Flipper -->
  <path d="M 160 350 Q 210 380 200 512 Q 150 490 140 360 Z" fill="#C5E063" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Belly -->
