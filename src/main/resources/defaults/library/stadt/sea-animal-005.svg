  <path d="M 80 330 Q 128 300 176 330" fill="none" stroke="#5A8C36" stroke-width="6" stroke-linecap="round" />
  
  <!-- Shell Highlight -->
  <path d="M 70 280 Q 128 250 180 280" fill="none" stroke="#A2D181" stroke-width="8" stroke-linecap="round" />
  
  <!-- Neck -->
