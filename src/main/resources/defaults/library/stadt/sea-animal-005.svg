  <!-- Shell -->
  <ellipse cx="128" cy="300" rx="100" ry="70" fill="#76B947" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Shell Patterns -->
  <path d="M 128 230 L 128 370" fill="none" stroke="#5A8C36" stroke-width="6" stroke-linecap="round" />
