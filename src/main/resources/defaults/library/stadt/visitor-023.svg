  <path d="M110 180 Q110 280 130 280 Q150 280 150 200" fill="none" stroke="#FFB7C5" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M110 180 Q110 280 130 280 Q150 280 150 200" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Head -->
  <circle cx="128" cy="130" r="45" fill="#FFDBAC" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Face -->
  <circle cx="115" cy="125" r="4" fill="#3B2A4A" />
  <circle cx="141" cy="125" r="4" fill="#3B2A4A" />
  <path d="M120 140 Q128 150 136 140" fill="none" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />

  <!-- Hat -->
  <path d="M83 120 Q83 70 128 70 Q173 70 173 120 Z" fill="#6F4E37" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="75" y="110" width="106" height="15" rx="7" fill="#6F4E37" stroke="#3B2A4A" stroke-width="8" />

  <!-- Cherry Blossom Detail on Coat -->
  <circle cx="160" cy="220" r="12" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="4" />
  <circle cx="160" cy="220" r="4" fill="#FFFFE0" stroke="#3B2A4A" stroke-width="2" />
  
  <!-- Highlights -->
  <path d="M90 170 Q100 165 110 170" fill="none" stroke="#A67B5B" stroke-width="6" stroke-linecap="round" />
  <path d="M140 110 Q145 100 155 110" fill="none" stroke="#8B6B5A" stroke-width="6" stroke-linecap="round" />
