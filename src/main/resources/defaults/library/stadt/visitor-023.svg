  <rect x="141" y="420" width="30" height="92" rx="15" fill="#4A3728" stroke="#3B2A4A" stroke-width="8" />

  <!-- Coat Body -->
  <path d="M60 180 Q60 160 80 160 L176 160 Q196 160 196 180 L200 430 Q200 450 180 450 L76 450 Q56 450 56 430 Z" fill="#8B5A2B" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Arms -->
  <rect x="40" y="200" width="30" height="150" rx="15" fill="#8B5A2B" stroke="#3B2A4A" stroke-width="8" transform="rotate(10 40 200)" />
  <rect x="186" y="200" width="30" height="150" rx="15" fill="#8B5A2B" stroke="#3B2A4A" stroke-width="8" transform="rotate(-10 216 200)" />

  <!-- Scarf -->
