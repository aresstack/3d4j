<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Legs -->
  <rect x="85" y="380" width="30" height="110" fill="#4A6FA5" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="141" y="380" width="30" height="110" fill="#4A6FA5" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Shoes -->
  <rect x="75" y="480" width="45" height="32" rx="10" fill="#5D4037" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="136" y="480" width="45" height="32" rx="10" fill="#5D4037" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Body / Cardigan -->
  <rect x="60" y="220" width="136" height="170" rx="30" fill="#E63946" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Cardigan Details (Buttons/Opening) -->
  <line x1="128" y1="220" x2="128" y2="390" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" />
  <circle cx="128" cy="260" r="6" fill="#F1FAEE" stroke="#3B2A4A" stroke-width="4" />
  <circle cx="128" cy="300" r="6" fill="#F1FAEE" stroke="#3B2A4A" stroke-width="4" />
  <circle cx="128" cy="340" r="6" fill="#F1FAEE" stroke="#3B2A4A" stroke-width="4" />

  <!-- Arms -->
  <rect x="35" y="230" width="30" height="120" rx="15" fill="#E63946" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="191" y="230" width="30" height="120" rx="15" fill="#E63946" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Hands -->
  <circle cx="50" cy="350" r="15" fill="#FFD8B1" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="206" cy="350" r="15" fill="#FFD8B1" stroke="#3B2A4A" stroke-width="8" />

  <!-- Neck -->
  <rect x="115" y="200" width="30" height="30" fill="#FFD8B1" stroke="#3B2A4A" stroke-width="8" />

  <!-- Head -->
  <circle cx="128" cy="150" r="50" fill="#FFD8B1" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Hair -->
  <path d="M78 150 Q78 90 128 90 Q178 90 178 150 L185 140 Q185 80 128 70 Q71 80 71 140 Z" fill="#BDBDBD" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <circle cx="110" cy="100" r="15" fill="#BDBDBD" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="146" cy="100" r="15" fill="#BDBDBD" stroke="#3B2A4A" stroke-width="8" />

  <!-- Glasses -->
  <circle cx="112" cy="155" r="15" fill="none" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="144" cy="155" r="15" fill="none" stroke="#3B2A4A" stroke-width="6" />
  <line x1="127" y1="155" x2="129" y2="155" stroke="#3B2A4A" stroke-width="6" />
  <!-- Glass Highlights -->
  <circle cx="108" cy="151" r="4" fill="white" />
  <circle cx="140" cy="151" r="4" fill="white" />

  <!-- Eyes -->
  <circle cx="112" cy="155" r="3" fill="#3B2A4A" />
  <circle cx="144" cy="155" r="3" fill="#3B2A4A" />

  <!-- Smile -->
  <path d="M115 175 Q128 190 141 175" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />

  <!-- Cardigan Highlight -->
  <path d="M75 240 Q85 240 85 280" fill="none" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round" opacity="0.6" />
