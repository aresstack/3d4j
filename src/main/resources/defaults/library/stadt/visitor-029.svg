  <rect x="85" y="485" width="45" height="27" rx="12" fill="#7B3F00" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="126" y="485" width="45" height="27" rx="12" fill="#7B3F00" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

