  <circle cx="183" cy="330" r="12" fill="#FFDBAC" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Backpack Straps -->
  <rect x="95" y="220" width="15" height="80" rx="5" fill="#FFB703" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="146" y="220" width="15" height="80" rx="5" fill="#FFB703" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Neck -->
