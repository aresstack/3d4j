  <circle cx="128" cy="160" r="40" fill="#FFDBAC" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Hair -->
  <path d="M 88 160 Q 88 120 128 110 Q 168 120 168 160 L 168 150 Q 150 130 138 150 Q 128 130 118 150 Q 106 130 88 150 Z" fill="#D62828" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
