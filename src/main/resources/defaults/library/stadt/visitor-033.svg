  <circle cx="138" cy="160" r="3" fill="#3B2A4A" />
  <path d="M 120 175 Q 128 185 136 175" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  
  <!-- Highlights -->
  <path d="M 90 230 Q 100 230 100 250" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <path d="M 166 230 Q 156 230 156 250" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <path d="M 80 230 Q 70 240 70 260" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <path d="M 186 230 Q 196 240 196 260" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5" />
