<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Backpack (Behind) -->
  <rect x="70" y="210" width="116" height="160" rx="20" fill="#FFB703" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <path d="M 90 230 Q 128 210 166 230" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" />
  
  <!-- Legs -->
  <rect x="95" y="360" width="32" height="120" fill="#5C677D" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="129" y="360" width="32" height="120" fill="#5C677D" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Shoes -->
  <rect x="85" y="480" width="42" height="32" rx="10" fill="#4B3621" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="129" y="480" width="42" height="32" rx="10" fill="#4B3621" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Torso / Jacket -->
  <rect x="85" y="220" width="86" height="140" rx="15" fill="#40E0D0" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Arms -->
  <rect x="60" y="220" width="25" height="110" rx="12" fill="#40E0D0" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
