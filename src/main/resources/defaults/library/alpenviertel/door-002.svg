  <line x1="40" y1="18" x2="88" y2="18" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="15" x2="78" y2="15" stroke="#8B5A2B" stroke-width="3" stroke-linecap="round" />

  <!-- Door -->
  <rect x="32" y="24" width="64" height="104" fill="#4A7C44" stroke="#3B2A4A" stroke-width="4" rx="2" />
  
  <!-- Carved Sunburst Pattern -->
