  <!-- Rays -->
  <g stroke="#3B2A4A" stroke-width="3" stroke-linecap="round">
    <line x1="64" y1="52" x2="64" y2="38" />
    <line x1="64" y1="52" x2="64" y2="66" />
    <line x1="64" y1="52" x2="50" y2="52" />
    <line x1="64" y1="52" x2="78" y2="52" />
    <line x1="64" y1="52" x2="54" y2="42" />
    <line x1="64" y1="52" x2="74" y2="42" />
    <line x1="64" y1="52" x2="54" y2="62" />
    <line x1="64" y1="52" x2="74" y2="62" />
  </g>

  <!-- Door Handle -->
  <circle cx="88" cy="75" r="3" fill="#D4AF37" stroke="#3B2A4A" stroke-width="2" />
  
  <!-- Door Highlight -->
  <path d="M38 30 L38 120" stroke="#5A8C54" stroke-width="3" stroke-linecap="round" />
