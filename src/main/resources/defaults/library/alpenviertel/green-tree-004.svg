<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Trunk -->
  <path d="M110 512 L115 350 Q128 340 141 350 L146 512 Z" fill="#8B5A2B" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Bench Backrest -->
  <path d="M60 440 Q128 410 196 440 L196 460 Q128 430 60 460 Z" fill="#A67B5B" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Bench Seat -->
  <path d="M50 460 Q128 430 206 460 L206 480 Q128 450 50 480 Z" fill="#8B5A2B" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Bench Legs -->
  <rect x="60" y="470" width="12" height="30" fill="#8B5A2B" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="184" y="470" width="12" height="30" fill="#8B5A2B" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Tree Canopy (Layered Circles for fluffiness) -->
  <circle cx="80" cy="220" r="70" fill="#4A7C44" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="176" cy="220" r="70" fill="#4A7C44" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="128" cy="160" r="80" fill="#4A7C44" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="128" cy="230" r="90" fill="#4A7C44" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Canopy Highlights -->
  <circle cx="100" cy="170" r="30" fill="#6B9E62" />
  <circle cx="150" cy="180" r="25" fill="#6B9E62" />
  <circle cx="120" cy="210" r="35" fill="#6B9E62" />
  
  <!-- Bavarian Flag -->
  <g transform="translate(170, 200) rotate(15)">
    <rect x="0" y="0" width="40" height="30" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
    <!-- Lozenge pattern (simplified) -->
    <path d="M0 0 L10 15 L0 30 Z" fill="#0091D4" />
    <path d="M10 0 L20 15 L10 30 Z" fill="#FFFFFF" />
    <path d="M20 0 L30 15 L20 30 Z" fill="#0091D4" />
    <path d="M30 0 L40 15 L30 30 Z" fill="#FFFFFF" />
    <path d="M10 0 L20 -15 L30 0 Z" fill="#0091D4" /> <!-- Not visible but for logic -->
    <path d="M0 15 L10 30 L20 15 Z" fill="#FFFFFF" />
    <path d="M10 15 L20 30 L30 15 Z" fill="#0091D4" />
    <path d="M20 15 L30 30 L40 15 Z" fill="#FFFFFF" />
  </g>
  
  <!-- Red Geraniums in a small pot on the bench -->
  <g transform="translate(70, 430)">
    <rect x="0" y="20" width="20" height="20" fill="#A67B5B" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
    <circle cx="5" cy="15" r="8" fill="#E3242B" stroke="#3B2A4A" stroke-width="6" />
    <circle cx="15" cy="10" r="8" fill="#E3242B" stroke="#3B2A4A" stroke-width="6" />
    <circle cx="10" cy="20" r="8" fill="#E3242B" stroke="#3B2A4A" stroke-width="6" />
    <circle cx="0" cy="10" r="8" fill="#E3242B" stroke="#3B2A4A" stroke-width="6" />
  </g>
  
  <g transform="translate(160, 430)">
    <rect x="0" y="20" width="20" height="20" fill="#A67B5B" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
    <circle cx="5" cy="15" r="8" fill="#E3242B" stroke="#3B2A4A" stroke-width="6" />
    <circle cx="15" cy="10" r="8" fill="#E3242B" stroke="#3B2A4A" stroke-width="6" />
    <circle cx="10" cy="20" r="8" fill="#E3242B" stroke="#3B2A4A" stroke-width="6" />
    <circle cx="0" cy="10" r="8" fill="#E3242B" stroke="#3B2A4A" stroke-width="6" />
  </g>
</svg>