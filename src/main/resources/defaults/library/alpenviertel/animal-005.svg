  <path d="M128,160 C80,160 60,260 60,360 C60,460 100,480 128,480 C156,480 196,460 196,360 C196,260 176,160 128,160" fill="#B5835A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
