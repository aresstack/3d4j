<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Trunk -->
  <path d="M80,512 L100,350 Q128,330 156,350 L176,512 Z" fill="#7B5E43" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
