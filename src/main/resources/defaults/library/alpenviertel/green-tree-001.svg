  <rect x="190" y="200" width="12" height="25" rx="6" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="4" />
  <rect x="150" y="210" width="12" height="25" rx="6" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="4" />
  <rect x="120" y="220" width="12" height="25" rx="6" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="4" />
  <rect x="80" y="210" width="12" height="25" rx="6" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="4" />
  <rect x="60" y="170" width="12" height="25" rx="6" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="4" />
