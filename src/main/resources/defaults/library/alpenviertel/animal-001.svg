  <circle cx="118" cy="215" r="4" fill="#3B2A4A" />
  <circle cx="138" cy="215" r="4" fill="#3B2A4A" />

  <!-- Eyes -->
  <circle cx="110" cy="145" r="7" fill="#3B2A4A" />
  <circle cx="146" cy="145" r="7" fill="#3B2A4A" />
  <circle cx="112" cy="142" r="2" fill="#FFFFFF" />
  <circle cx="148" cy="142" r="2" fill="#FFFFFF" />

  <!-- Collar -->
  <path d="M95 220 Q128 240 161 220 L161 245 Q128 265 95 245 Z" fill="#7B4B2A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Bell -->
  <path d="M115 250 L141 250 L145 290 Q128 305 111 290 Z" fill="#FFD700" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <!-- Bell Highlight -->
  <path d="M120 260 Q125 255 130 260" fill="none" stroke="#FFF176" stroke-width="4" stroke-linecap="round" />
  <!-- Bell Clapper -->
  <circle cx="128" cy="295" r="6" fill="#B8860B" stroke="#3B2A4A" stroke-width="4" />
