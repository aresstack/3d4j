<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Wooden Tub Body -->
  <path d="M 60 320 L 60 440 Q 128 512 196 440 L 196 320 Z" fill="#A67C52" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Tub Rim -->
  <ellipse cx="128" cy="320" rx="70" ry="20" fill="#8B5A2B" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Wooden Slats (Vertical lines) -->
  <line x1="90" y1="330" x2="95" y2="460" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="128" y1="330" x2="128" y2="480" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="166" y1="330" x2="161" y2="460" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  
  <!-- Metal Bands -->
  <path d="M 63 370 Q 128 390 193 370 L 193 385 Q 128 405 63 385 Z" fill="#5D5D5D" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  <path d="M 75 430 Q 128 450 181 430 L 181 445 Q 128 465 75 445 Z" fill="#5D5D5D" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />

  <!-- Leaves (Greenery) -->
  <path d="M 128 320 Q 80 300 60 340 Q 80 360 128 320" fill="#4A7C44" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  <path d="M 128 320 Q 176 300 196 340 Q 176 360 128 320" fill="#4A7C44" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  <path d="M 128 320 Q 110 260 140 250 Q 150 280 128 320" fill="#6B8E23" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  <path d="M 128 320 Q 150 260 116 250 Q 106 280 128 320" fill="#6B8E23" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  <path d="M 100 320 Q 70 280 90 260 Q 110 280 100 320" fill="#4A7C44" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  <path d="M 156 320 Q 186 280 166 260 Q 146 280 156 320" fill="#4A7C44" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />

  <!-- Red Geranium Flowers (Clusters of circles) -->
  <!-- Left Cluster -->
  <circle cx="80" cy="300" r="15" fill="#E63946" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="95" cy="290" r="15" fill="#E63946" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="90" cy="310" r="15" fill="#E63946" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="85" cy="295" r="6" fill="#FFB3B3" /> <!-- Highlight -->

  <!-- Center Cluster -->
  <circle cx="128" cy="270" r="18" fill="#E63946" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="110" cy="280" r="18" fill="#E63946" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="146" cy="280" r="18" fill="#E63946" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="128" cy="285" r="6" fill="#FFB3B3" /> <!-- Highlight -->

  <!-- Right Cluster -->
  <circle cx="176" cy="300" r="15" fill="#E63946" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="161" cy="290" r="15" fill="#E63946" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="166" cy="310" r="15" fill="#E63946" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="171" cy="295" r="6" fill="#FFB3B3" /> <!-- Highlight -->
  
  <!-- Topmost Flower -->
  <circle cx="128" cy="240" r="15" fill="#E63946" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="128" cy="235" r="5" fill="#FFB3B3" />
</svg>