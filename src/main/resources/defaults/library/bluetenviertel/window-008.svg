<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Shutters -->
  <rect x="14" y="24" width="10" height="80" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  <rect x="104" y="24" width="10" height="80" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />

  <!-- Window Frame -->
  <rect x="24" y="24" width="80" height="80" fill="#FFFDD0" stroke="#3B2A4A" stroke-width="4" rx="4" stroke-linejoin="round" />
  
  <!-- Glass -->
  <rect x="30" y="30" width="68" height="68" fill="#B0E0E6" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  
  <!-- Glass Highlights -->
  <rect x="34" y="34" width="12" height="4" fill="#E0F7FA" />
  <rect x="34" y="40" width="4" height="12" fill="#E0F7FA" />
  
  <!-- Window Sashes -->
  <rect x="62" y="30" width="4" height="68" fill="#FFFDD0" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <rect x="30" y="62" width="68" height="4" fill="#FFFDD0" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Balcony Railing -->
  <rect x="20" y="64" width="88" height="6" fill="#D2B48C" stroke="#3B2A4A" stroke-width="4" rx="3" stroke-linejoin="round" />
  <rect x="20" y="94" width="88" height="6" fill="#D2B48C" stroke="#3B2A4A" stroke-width="4" rx="3" stroke-linejoin="round" />
  
  <!-- Railing Bars -->
  <rect x="32" y="70" width="6" height="24" fill="#D2B48C" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <rect x="48" y="70" width="6" height="24" fill="#D2B48C" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <rect x="74" y="70" width="6" height="24" fill="#D2B48C" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <rect x="90" y="70" width="6" height="24" fill="#D2B48C" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Cherry Blossom Flowers -->
  <circle cx="22" cy="64" r="4" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="28" cy="62" r="4" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="100" cy="62" r="4" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="106" cy="64" r="4" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="64" cy="62" r="4" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="2" />
