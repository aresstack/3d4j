<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Shutters -->
  <rect x="14" y="30" width="10" height="80" rx="2" fill="#B2E2B2" stroke="#3B2A4A" stroke-width="5" stroke-linejoin="round" />
  <rect x="104" y="30" width="10" height="80" rx="2" fill="#B2E2B2" stroke="#3B2A4A" stroke-width="5" stroke-linejoin="round" />

  <!-- Window Frame -->
  <rect x="24" y="30" width="80" height="80" rx="2" fill="#D2B48C" stroke="#3B2A4A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Glass -->
  <rect x="30" y="36" width="72" height="72" rx="2" fill="#B0E0E6" stroke="#3B2A4A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Glass Highlights -->
  <path d="M 35 40 L 45 40 L 35 50 Z" fill="#E0F7FA" />
  <path d="M 80 40 L 90 40 L 80 50 Z" fill="#E0F7FA" />

  <!-- Sashes -->
  <rect x="62" y="36" width="4" height="72" fill="#FFFDD0" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <rect x="30" y="72" width="72" height="4" fill="#FFFDD0" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />

  <!-- Awning Base -->
  <path d="M 20 15 H 108 V 35 Q 64 25 20 35 Z" fill="#FFB7C5" />
  
  <!-- Awning Stripes -->
  <rect x="30" y="15" width="12" height="20" fill="#FFFDD0" />
  <rect x="52" y="15" width="12" height="20" fill="#FFFDD0" />
  <rect x="74" y="15" width="12" height="20" fill="#FFFDD0" />
  <rect x="96" y="15" width="12" height="20" fill="#FFFDD0" />
  
  <!-- Awning Outline -->
  <path d="M 20 15 H 108 V 35 Q 64 25 20 35 Z" fill="none" stroke="#3B2A4A" stroke-width="5" stroke-linejoin="round" />

  <!-- Flowers on the sill -->
  <circle cx="30" cy="110" r="4" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="3" />
  <circle cx="30" cy="110" r="1.5" fill="#FFFDD0" />
  
  <circle cx="64" cy="110" r="4" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="3" />
  <circle cx="64" cy="110" r="1.5" fill="#FFFDD0" />
  
  <circle cx="98" cy="110" r="4" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="3" />
  <circle cx="98" cy="110" r="1.5" fill="#FFFDD0" />
</svg>