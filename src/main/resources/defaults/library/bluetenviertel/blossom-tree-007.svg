<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Trunk -->
  <path d="M110 512 Q128 450 120 300 L136 300 Q128 450 146 512 Z" 
        fill="#7A4A2A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Main Fluffy Crown Shape -->
  <path d="M128 100 
           A 40 40 0 0 1 88 120 
           A 50 50 0 0 1 40 180 
           A 60 60 0 0 1 60 260 
           A 40 40 0 0 1 100 310 
           A 40 40 0 0 1 156 310 
           A 60 60 0 0 1 196 260 
           A 50 50 0 0 1 216 180 
           A 40 40 0 0 1 168 120 
           A 40 40 0 0 1 128 100 Z" 
        fill="#FFB7C5" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Crown Highlights (Lighter Pink Blobs) -->
  <circle cx="100" cy="160" r="30" fill="#FFD1DC" />
  <circle cx="150" cy="150" r="35" fill="#FFD1DC" />
  <circle cx="128" cy="130" r="25" fill="#FFD1DC" />
  <circle cx="80" cy="210" r="25" fill="#FFD1DC" />
  <circle cx="170" cy="220" r="30" fill="#FFD1DC" />
  
  <!-- Crown Shadows (Darker Pink Blobs) -->
  <circle cx="110" cy="260" r="20" fill="#F48FB1" />
  <circle cx="140" cy="270" r="25" fill="#F48FB1" />
  <circle cx="70" cy="240" r="20" fill="#F48FB1" />
  <circle cx="180" cy="250" r="20" fill="#F48FB1" />

  <!-- Small Flower Accents -->
  <circle cx="128" cy="110" r="6" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="90" cy="140" r="6" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="160" cy="180" r="6" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="110" cy="210" r="6" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="140" cy="230" r="6" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="2" />

  <!-- Fallen Petals on Ground -->
  <ellipse cx="90" cy="505" rx="8" ry="4" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="4" />
  <ellipse cx="160" cy="508" rx="8" ry="4" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="4" />
  <ellipse cx="130" cy="510" rx="8" ry="4" fill="#FFD1DC" stroke="#3B2A4A" stroke-width="4" />
</svg>