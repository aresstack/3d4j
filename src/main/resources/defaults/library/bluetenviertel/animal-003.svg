<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Feet -->
  <path d="M90 460 L70 512 L110 512 L110 460" fill="#FFB347" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <path d="M166 460 L146 512 L186 512 L186 460" fill="#FFB347" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Body -->
  <ellipse cx="128" cy="320" rx="80" ry="140" fill="#A0A0A0" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Chest Highlight -->
  <ellipse cx="128" cy="330" rx="50" ry="80" fill="#C0C0C0" />

  <!-- Wings -->
  <path d="M60 280 Q30 320 60 400 Q80 420 100 380 Q100 320 60 280" fill="#808080" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <path d="M196 280 Q226 320 196 400 Q176 420 156 380 Q156 320 196 280" fill="#808080" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Neck/Head Connection -->
  <rect x="98" y="180" width="60" height="60" rx="30" fill="#A0A0A0" stroke="#3B2A4A" stroke-width="8" />

  <!-- Head -->
  <circle cx="128" cy="140" r="55" fill="#A0A0A0" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Head Highlight -->
  <circle cx="140" cy="120" r="15" fill="#C0C0C0" />

  <!-- Eyes -->
  <circle cx="110" cy="130" r="12" fill="white" stroke="#3B2A4A" stroke-width="4" />
  <circle cx="112" cy="130" r="5" fill="#3B2A4A" />
  
  <circle cx="146" cy="130" r="12" fill="white" stroke="#3B2A4A" stroke-width="4" />
  <circle cx="148" cy="130" r="5" fill="#3B2A4A" />

  <!-- Beak -->
  <path d="M120 150 Q128 145 136 150 L128 175 Z" fill="#FFB347" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
</svg>