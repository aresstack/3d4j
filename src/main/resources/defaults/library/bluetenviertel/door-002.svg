<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Outer Frame (Cream White) -->
  <rect x="30" y="14" width="68" height="114" fill="#FFFDD0" stroke="#3B2A4A" stroke-width="5" rx="6" stroke-linejoin="round" />
  
  <!-- Left Door Leaf (Soft Pink) -->
  <rect x="34" y="18" width="30" height="110" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="5" rx="4" stroke-linejoin="round" />
  <!-- Left Door Panels -->
  <rect x="38" y="22" width="22" height="38" fill="#F8A5B5" stroke="#3B2A4A" stroke-width="4" rx="4" />
  <rect x="38" y="68" width="22" height="38" fill="#F8A5B5" stroke="#3B2A4A" stroke-width="4" rx="4" />
  
  <!-- Right Door Leaf (Soft Pink) -->
  <rect x="64" y="18" width="30" height="110" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="5" rx="4" stroke-linejoin="round" />
  <!-- Right Door Panels -->
  <rect x="68" y="22" width="22" height="38" fill="#F8A5B5" stroke="#3B2A4A" stroke-width="4" rx="4" />
  <rect x="68" y="68" width="22" height="38" fill="#F8A5B5" stroke="#3B2A4A" stroke-width="4" rx="4" />
  
  <!-- Brass Handles -->
  <circle cx="61" cy="64" r="4" fill="#D4AF37" stroke="#3B2A4A" stroke-width="4" />
  <circle cx="67" cy="64" r="4" fill="#D4AF37" stroke="#3B2A4A" stroke-width="4" />
  <!-- Handle Highlights -->
  <circle cx="60" cy="63" r="1" fill="#FFFFFF" />
  <circle cx="66" cy="63" r="1" fill="#FFFFFF" />
  
  <!-- Cherry Blossom Decorations -->
  <!-- Top Left Cluster -->
  <circle cx="34" cy="18" r="5" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="3" />
  <circle cx="38" cy="14" r="5" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="3" />
  <circle cx="30" cy="22" r="5" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="3" />
  <circle cx="34" cy="18" r="1.5" fill="#FFFFFF" />
  
  <!-- Top Right Cluster -->
  <circle cx="94" cy="18" r="5" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="3" />
  <circle cx="90" cy="14" r="5" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="3" />
  <circle cx="98" cy="22" r="5" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="3" />
  <circle cx="94" cy="18" r="1.5" fill="#FFFFFF" />
</svg>