  <!-- Mint Green Leaves -->
  <ellipse cx="80" cy="210" rx="12" ry="6" fill="#B2E2B2" stroke="#3B2A4A" stroke-width="6" transform="rotate(-30 80 210)" />
  <ellipse cx="176" cy="210" rx="12" ry="6" fill="#B2E2B2" stroke="#3B2A4A" stroke-width="6" transform="rotate(30 176 210)" />
  <ellipse cx="128" cy="240" rx="12" ry="6" fill="#B2E2B2" stroke="#3B2A4A" stroke-width="6" />

