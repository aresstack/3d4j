  <circle cx="156" cy="180" r="6" fill="#FF8DA1" />
  <circle cx="120" cy="200" r="6" fill="#FF8DA1" />
  <circle cx="145" cy="210" r="6" fill="#FF8DA1" />
  <circle cx="115" cy="120" r="6" fill="#FF8DA1" />
