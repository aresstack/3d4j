  <circle cx="90" cy="170" r="50" fill="#FFD1DC" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="166" cy="170" r="50" fill="#FFD1DC" stroke="#3B2A4A" stroke-width="8" />
