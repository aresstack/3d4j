  <circle cx="170" cy="140" r="10" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="4" />
  <circle cx="200" cy="120" r="10" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="4" />

