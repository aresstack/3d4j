  <!-- Cherry Blossom Flowers on Canopy -->
  <circle cx="25" cy="22" r="3" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="103" cy="22" r="3" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="64" cy="15" r="3" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="2" />
</svg>