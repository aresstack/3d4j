<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Door Frame -->
  <rect x="28" y="16" width="72" height="112" fill="#FFFDD0" stroke="#3B2A4A" stroke-width="4" rx="4" stroke-linejoin="round" />
  
  <!-- Door -->
  <rect x="32" y="20" width="64" height="108" fill="#F8C8DC" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  
  <!-- Glass Pane -->
  <rect x="42" y="30" width="44" height="40" fill="#B0E0E6" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  
  <!-- Glass Highlight -->
  <path d="M 46 34 L 55 34" stroke="white" stroke-width="3" stroke-linecap="round" />
  
  <!-- Canopy -->
  <path d="M 20 24 Q 64 12 108 24 L 108 28 Q 64 16 20 28 Z" fill="#D2B48C" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
