  <ellipse cx="176" cy="480" rx="45" ry="30" fill="#A67C52" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Body -->
  <path d="M60 470 Q60 300 128 300 Q196 300 196 470 Z" fill="#A67C52" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Belly -->
  <ellipse cx="128" cy="380" rx="40" ry="60" fill="#D2B48C" />
  
  <!-- Arms -->
  <ellipse cx="90" cy="350" rx="15" ry="25" fill="#A67C52" stroke="#3B2A4A" stroke-width="8" transform="rotate(-20 90 350)" />
  <ellipse cx="166" cy="350" rx="15" ry="25" fill="#A67C52" stroke="#3B2A4A" stroke-width="8" transform="rotate(20 166 350)" />
  
  <!-- Ears -->
  <ellipse cx="100" cy="110" rx="22" ry="80" fill="#A67C52" stroke="#3B2A4A" stroke-width="8" />
  <ellipse cx="100" cy="120" rx="12" ry="60" fill="#D2B48C" />
  
  <ellipse cx="156" cy="110" rx="22" ry="80" fill="#A67C52" stroke="#3B2A4A" stroke-width="8" />
  <ellipse cx="156" cy="120" rx="12" ry="60" fill="#D2B48C" />
  
  <!-- Head -->
  <ellipse cx="128" cy="220" rx="65" ry="55" fill="#A67C52" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Face -->
  <circle cx="110" cy="210" r="8" fill="#3B2A4A" />
  <circle cx="112" cy="207" r="3" fill="white" />
  
  <circle cx="146" cy="210" r="8" fill="#3B2A4A" />
  <circle cx="148" cy="207" r="3" fill="white" />
  
  <ellipse cx="128" cy="230" rx="8" ry="5" fill="#FFB6C1" stroke="#3B2A4A" stroke-width="4" />
  
  <path d="M123 235 Q128 245 133 235" fill="none" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  
  <!-- Highlights -->
  <path d="M100 200 Q110 190 120 200" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.3" />
