<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Glow behind the lantern -->
  <circle cx="128" cy="125" r="55" fill="#FFD700" />
  
  <!-- Base of the lamp -->
  <path d="M100 512 L156 512 L145 470 L111 470 Z" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Main Post -->
  <rect x="118" y="150" width="20" height="320" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Decorative Rings on Post -->
  <rect x="114" y="200" width="28" height="12" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  <rect x="114" y="400" width="28" height="12" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Post Highlight -->
  <rect x="122" y="160" width="4" height="300" fill="#6A6A6A" />
  
  <!-- Lantern Body -->
  <path d="M110 150 L146 150 L140 100 L120 100 Z" fill="#FFF176" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Lantern Roof -->
  <path d="M90 100 L166 100 L140 70 L116 70 Z" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Lantern Top Cap -->
  <path d="M120 70 L136 70 L128 60 Z" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Lantern Glass Highlight -->
  <path d="M125 110 L130 110 L125 130 Z" fill="#FFFFFF" />
</svg>