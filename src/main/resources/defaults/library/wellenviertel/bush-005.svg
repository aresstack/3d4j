<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Driftwood pieces poking out -->
  <path d="M110 310 Q 90 220 60 240" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" />
  <path d="M110 310 Q 90 220 60 240" fill="none" stroke="#E5E4E2" stroke-width="4" stroke-linecap="round" />
  
  <path d="M140 310 Q 160 200 190 230" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" />
  <path d="M140 310 Q 160 200 190 230" fill="none" stroke="#E5E4E2" stroke-width="4" stroke-linecap="round" />

  <!-- Crate Main Body -->
  <path d="M60 320 L196 320 L196 512 L60 512 Z" fill="#E6C9A8" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Crate Top Perspective -->
  <path d="M60 320 L80 280 L216 280 L196 320 Z" fill="#D2B48C" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Wooden Planks (Front) -->
  <line x1="100" y1="320" x2="100" y2="512" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="156" y1="320" x2="156" y2="512" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  
  <!-- Wooden Planks (Top) -->
  <line x1="110" y1="320" x2="130" y2="280" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="160" y1="320" x2="180" y2="280" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />

  <!-- Weathering details -->
  <line x1="70" y1="350" x2="90" y2="350" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <line x1="170" y1="420" x2="190" y2="420" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" opacity="0.4" />

  <!-- Seashells -->
  <!-- Pink Shell -->
  <path d="M120 310 Q 135 280 150 310 Z" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  <path d="M125 305 Q 135 290 145 305" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- White Shell -->
  <circle cx="100" cy="325" r="12" fill="#FFF5EE" stroke="#3B2A4A" stroke-width="6" />
  <path d="M95 325 Q 100 320 105 325" fill="none" stroke="#3B2A4A" stroke-width="3" stroke-linecap="round" />

  <!-- Yellow Shell -->
  <path d="M160 315 Q 175 290 190 315 Z" fill="#FFE4B5" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  <path d="M165 310 Q 175 295 185 310" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Small shell spilling over -->
  <circle cx="65" cy="330" r="8" fill="#FFD1DC" stroke="#3B2A4A" stroke-width="6" />
</svg>