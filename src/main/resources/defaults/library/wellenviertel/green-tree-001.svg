<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Trunk: Sandy Beige, Wave-shaped -->
  <path d="M 128 512 
           C 160 480, 200 400, 140 320 
           C 80 240, 160 180, 128 100" 
        fill="none" 
        stroke="#3B2A4A" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  <path d="M 128 512 
           C 160 480, 200 400, 140 320 
           C 80 240, 160 180, 128 100" 
        fill="none" 
        stroke="#E6D5B8" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Small side branches -->
  <path d="M 155 360 Q 180 340 190 310" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" />
  <path d="M 155 360 Q 180 340 190 310" fill="none" stroke="#E6D5B8" stroke-width="4" stroke-linecap="round" />
  
  <path d="M 110 260 Q 70 240 60 210" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" />
  <path d="M 110 260 Q 70 240 60 210" fill="none" stroke="#E6D5B8" stroke-width="4" stroke-linecap="round" />

  <!-- Foliage: Silvery-green clusters -->
  <!-- Top Cluster -->
  <circle cx="128" cy="80" r="40" fill="#B8C9B8" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="100" cy="100" r="30" fill="#B8C9B8" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="156" cy="100" r="30" fill="#B8C9B8" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Middle Cluster -->
  <circle cx="160" cy="180" r="35" fill="#B8C9B8" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="180" cy="160" r="25" fill="#B8C9B8" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Side Cluster Right -->
  <circle cx="190" cy="310" r="30" fill="#B8C9B8" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="210" cy="290" r="20" fill="#B8C9B8" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Side Cluster Left -->
  <circle cx="60" cy="210" r="30" fill="#B8C9B8" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="40" cy="190" r="20" fill="#B8C9B8" stroke="#3B2A4A" stroke-width="8" />

  <!-- Highlights -->
  <circle cx="120" cy="70" r="10" fill="#DCE5DC" />
  <circle cx="170" cy="170" r="8" fill="#DCE5DC" />
  <circle cx="185" cy="300" r="8" fill="#DCE5DC" />
  <circle cx="50" cy="200" r="8" fill="#DCE5DC" />
  
  <!-- Trunk Highlight -->
  <path d="M 145 400 Q 160 380 150 350" fill="none" stroke="#F5F5DC" stroke-width="4" stroke-linecap="round" />
</svg>