  <circle cx="220" cy="120" r="30" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="140" cy="60" r="25" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="8" />

  <!-- Blossom Highlights -->
  <circle cx="150" cy="80" r="10" fill="#FFE4E1" />
  <circle cx="190" cy="70" r="8" fill="#FFE4E1" />
  <circle cx="170" cy="40" r="8" fill="#FFE4E1" />
