  <ellipse cx="95" cy="90" rx="12" ry="60" fill="#D2B48C" stroke="#3B2A4A" stroke-width="0" />
  
  <ellipse cx="161" cy="80" rx="22" ry="80" fill="#A67C52" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
