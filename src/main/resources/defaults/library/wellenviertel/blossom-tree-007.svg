  <path d="M 60 410 Q 128 370 196 410" fill="none" stroke="#D2B48C" stroke-width="12" stroke-linecap="round" />

  <!-- Cherry Tree Trunk -->
  <path d="M 170 512 Q 160 300 100 200" fill="none" stroke="#7D5C4C" stroke-width="18" stroke-linecap="round" />
  
