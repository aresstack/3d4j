<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Roof Structure -->
  <!-- Main Roof Body (Sandy Beige) -->
  <path d="M 20 512 L 236 512 L 236 420 C 200 360 56 360 20 420 Z" fill="#F5E6CA" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
