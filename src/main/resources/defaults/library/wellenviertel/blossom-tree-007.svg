  <circle cx="160" cy="190" r="40" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="70" cy="210" r="35" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="130" cy="210" r="35" fill="#FFB7C5" stroke="#3B2A4A" stroke-width="8" />

