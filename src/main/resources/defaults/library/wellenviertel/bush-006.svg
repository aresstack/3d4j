<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Barrel Body -->
  <path d="M 70 250 Q 60 380 70 512 L 186 512 Q 196 380 186 250 Z" 
        fill="#F5E6C4" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Barrel Top Rim -->
  <ellipse cx="128" cy="250" rx="58" ry="15" 
           fill="#F5E6C4" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Sand Fill -->
  <ellipse cx="128" cy="250" rx="50" ry="10" 
           fill="#EDC9AF" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Barrel Bands (Pastel Blue to match district) -->
  <path d="M 66 310 Q 128 320 190 310 L 190 330 Q 128 340 66 330 Z" 
        fill="#AEC6CF" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <path d="M 69 430 Q 128 440 187 430 L 187 450 Q 128 460 69 450 Z" 
        fill="#AEC6CF" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Highlights on Barrel -->
  <path d="M 85 270 Q 75 380 85 420" 
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.5" />
  
  <!-- Sea Lavender Stem -->
  <path d="M 135 250 Q 145 200 130 140" 
        fill="none" stroke="#8FBC8F" stroke-width="8" stroke-linecap="round" />
  
  <!-- Sea Lavender Flowers -->
  <circle cx="130" cy="140" r="8" fill="#B19CD9" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="138" cy="155" r="7" fill="#B19CD9" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="122" cy="165" r="7" fill="#B19CD9" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="135" cy="180" r="6" fill="#B19CD9" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="125" cy="195" r="6" fill="#B19CD9" stroke="#3B2A4A" stroke-width="6" />
</svg>