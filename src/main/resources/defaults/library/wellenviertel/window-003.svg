<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Window Frame -->
  <rect x="20" y="20" width="88" height="88" fill="#F5E6CA" stroke="#3B2A4A" stroke-width="5" rx="2" ry="2" />
  
  <!-- Glass / Interior Area -->
  <rect x="26" y="26" width="76" height="76" fill="#BDE0FE" stroke="#3B2A4A" stroke-width="5" />
  
  <!-- Cozy Interior Glimpse: Curtain -->
  <path d="M 26 26 Q 45 26 45 60 L 26 60 Z" fill="#FFF5EE" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Cozy Interior Glimpse: Small Plant -->
  <rect x="85" y="85" width="10" height="10" fill="#E9C46A" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <path d="M 87 85 Q 87 75 92 75 Q 97 75 97 85 Z" fill="#A7C957" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Window Mullions (Cross-bars) -->
  <rect x="62" y="26" width="4" height="76" fill="#F5E6CA" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <rect x="26" y="62" width="76" height="4" fill="#F5E6CA" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Glass Highlights -->
  <path d="M 70 35 L 80 45" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <path d="M 75 30 L 85 40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  
  <!-- White Shutters (Slightly Ajar) -->
  <rect x="16" y="18" width="14" height="92" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="5" rx="2" ry="2" />
  <rect x="98" y="18" width="14" height="92" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="5" rx="2" ry="2" />
</svg>