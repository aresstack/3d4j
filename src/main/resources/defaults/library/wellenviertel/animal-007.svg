  <path d="M170 460 Q230 460 220 380 Q210 300 160 320" fill="none" stroke="#F9A63C" stroke-width="8" stroke-linecap="round" />

  <!-- Body -->
  <path d="M60 480 Q60 220 128 220 Q196 220 196 480 Z" fill="#F9A63C" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
