  <path d="M80 120 L70 60 L115 110 Z" fill="#F9A63C" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <path d="M176 120 L186 60 L141 110 Z" fill="#F9A63C" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Inner Ears -->
  <path d="M85 115 L78 75 L110 110 Z" fill="#FFC87A" />
  <path d="M171 115 L178 75 L146 110 Z" fill="#FFC87A" />

