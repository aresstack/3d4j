<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Driftwood sticking out of the crate -->
  <path d="M90 300 Q80 220 120 240 T150 260" fill="#FDF5E6" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <path d="M140 300 Q160 210 190 230 T210 270" fill="#FDF5E6" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Crate Side -->
  <path d="M196 300 L210 270 L210 512 L196 512 Z" fill="#D2B48C" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Crate Top -->
  <path d="M60 300 L196 300 L210 270 L74 270 Z" fill="#E8D5B5" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Crate Front -->
  <rect x="60" y="300" width="136" height="212" fill="#E8D5B5" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Wood Planks on Front -->
  <line x1="60" y1="360" x2="196" y2="360" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="60" y1="420" x2="196" y2="420" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="60" y1="480" x2="196" y2="480" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  
  <!-- Wood Grain/Weathering Details -->
  <line x1="80" y1="320" x2="110" y2="320" stroke="#D2B48C" stroke-width="6" stroke-linecap="round" />
  <line x1="150" y1="440" x2="180" y2="440" stroke="#D2B48C" stroke-width="6" stroke-linecap="round" />
  <line x1="100" y1="380" x2="130" y2="380" stroke="#D2B48C" stroke-width="6" stroke-linecap="round" />

  <!-- Seashells -->
  <!-- Pink Scallop Shell -->
  <path d="M80 300 A25 25 0 0 1 130 300 Z" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <line x1="105" y1="300" x2="105" y2="275" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  
  <!-- Yellow Spiral Shell -->
  <path d="M140 290 Q160 260 180 290 Q170 310 140 300 Z" fill="#FFFACD" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- White Small Shell -->
  <ellipse cx="70" cy="315" rx="12" ry="8" fill="#FFFFFF" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Another Pink Shell on the side -->
  <path d="M190 310 A15 15 0 0 1 210 310 Z" fill="#FFC0CB" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Highlights -->
  <line x1="75" y1="280" x2="100" y2="280" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <line x1="200" y1="280" x2="205" y2="320" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5" />
</svg>