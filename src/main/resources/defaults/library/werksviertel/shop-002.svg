<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Iron Rail (Rust Red) -->
  <rect x="10" y="18" width="108" height="6" fill="#A55D5D" stroke="#3B2A4A" stroke-width="4" rx="3" stroke-linejoin="round" />
  
  <!-- Rollers -->
  <circle cx="30" cy="24" r="4" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="4" />
  <circle cx="80" cy="24" r="4" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="4" />
  
  <!-- Main Wooden Gate (Weathered Green) -->
  <rect x="14" y="24" width="100" height="88" fill="#7A9B7A" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  
  <!-- Vertical Planks -->
  <line x1="24" y1="24" x2="24" y2="112" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  <line x1="34" y1="24" x2="34" y2="112" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="24" x2="44" y2="112" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  <line x1="54" y1="24" x2="54" y2="112" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  <line x1="64" y1="24" x2="64" y2="112" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  <line x1="74" y1="24" x2="74" y2="112" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  <line x1="84" y1="24" x2="84" y2="112" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  <line x1="94" y1="24" x2="94" y2="112" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  <line x1="104" y1="24" x2="104" y2="112" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  
  <!-- Horizontal Brace -->
