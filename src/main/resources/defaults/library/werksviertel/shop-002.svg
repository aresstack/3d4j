  <!-- Wicket Door -->
  <rect x="74" y="62" width="30" height="50" fill="#6A8B6A" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  <line x1="84" y1="62" x2="84" y2="112" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  <line x1="94" y1="62" x2="94" y2="112" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  
  <!-- Door Handle -->
  <circle cx="78" cy="85" r="3" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="2" />
  
  <!-- Rivets -->
  <circle cx="15" cy="21" r="2" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="35" cy="21" r="2" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="55" cy="21" r="2" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="75" cy="21" r="2" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="95" cy="21" r="2" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="113" cy="21" r="2" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="2" />
  
  <circle cx="16" cy="26" r="2" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="112" cy="26" r="2" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="16" cy="110" r="2" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="112" cy="110" r="2" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="2" />
  
  <!-- Weeds -->
  <path d="M14 112 Q 18 105 22 112" fill="none" stroke="#5A7B5A" stroke-width="4" stroke-linecap="round" />
  <path d="M106 112 Q 110 106 114 112" fill="none" stroke="#5A7B5A" stroke-width="4" stroke-linecap="round" />
