  <!-- Windows -->
  <rect x="40" y="35" width="16" height="16" fill="#BDE0FE" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <rect x="72" y="35" width="16" height="16" fill="#BDE0FE" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Handles -->
  <rect x="60" y="65" width="3" height="8" fill="#5D6D7E" stroke="#3B2A4A" stroke-width="3" stroke-linejoin="round" />
  <rect x="65" y="65" width="3" height="8" fill="#5D6D7E" stroke="#3B2A4A" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Rivets -->
  <circle cx="35" cy="27" r="2" fill="#7D342E" />
  <circle cx="35" cy="125" r="2" fill="#7D342E" />
  <circle cx="61" cy="27" r="2" fill="#7D342E" />
  <circle cx="61" cy="125" r="2" fill="#7D342E" />
  <circle cx="67" cy="27" r="2" fill="#7D342E" />
  <circle cx="67" cy="125" r="2" fill="#7D342E" />
  <circle cx="93" cy="27" r="2" fill="#7D342E" />
  <circle cx="93" cy="125" r="2" fill="#7D342E" />
  
  <!-- Lamp Bracket -->
  <rect x="62" y="20" width="4" height="4" fill="#5D6D7E" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Lamp Shade -->
  <path d="M 56 20 L 72 20 L 72 16 Q 72 12 64 12 Q 56 12 56 16 Z" fill="#5D6D7E" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
