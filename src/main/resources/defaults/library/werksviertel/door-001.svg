<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Door Body -->
  <rect x="32" y="16" width="64" height="112" rx="2" ry="2" fill="#7A9E7A" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
