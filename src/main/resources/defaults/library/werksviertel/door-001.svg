  <line x1="68" y1="30" x2="68" y2="54" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" />
  
  <!-- Rivets -->
  <circle cx="38" cy="22" r="3" fill="#5A7E5A" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="90" cy="22" r="3" fill="#5A7E5A" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="38" cy="45" r="3" fill="#5A7E5A" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="90" cy="45" r="3" fill="#5A7E5A" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="38" cy="68" r="3" fill="#5A7E5A" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="90" cy="68" r="3" fill="#5A7E5A" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="38" cy="95" r="3" fill="#5A7E5A" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="90" cy="95" r="3" fill="#5A7E5A" stroke="#3B2A4A" stroke-width="2" />
