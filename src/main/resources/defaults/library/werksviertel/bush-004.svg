<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Industrial Concrete Base -->
  <rect x="60" y="440" width="136" height="72" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Rusted Iron Rim -->
  <rect x="50" y="430" width="156" height="20" rx="5" fill="#A54A3A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Rivets on the iron rim -->
  <circle cx="65" cy="440" r="4" fill="#3B2A4A" />
  <circle cx="128" cy="440" r="4" fill="#3B2A4A" />
  <circle cx="191" cy="440" r="4" fill="#3B2A4A" />

  <!-- Main Stem/Trunk -->
  <path d="M128 430 Q135 350 120 250 T128 100" fill="none" stroke="#6D4C41" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M128 430 Q135 350 120 250 T128 100" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Branches -->
  <path d="M125 320 Q80 300 60 260" fill="none" stroke="#6D4C41" stroke-width="12" stroke-linecap="round" />
  <path d="M125 320 Q80 300 60 260" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  
  <path d="M130 280 Q170 260 190 220" fill="none" stroke="#6D4C41" stroke-width="12" stroke-linecap="round" />
  <path d="M130 280 Q170 260 190 220" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  
  <path d="M120 200 Q90 180 80 140" fill="none" stroke="#6D4C41" stroke-width="12" stroke-linecap="round" />
  <path d="M120 200 Q90 180 80 140" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  
  <path d="M128 180 Q160 160 170 120" fill="none" stroke="#6D4C41" stroke-width="12" stroke-linecap="round" />
  <path d="M128 180 Q160 160 170 120" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />

  <!-- Leaves -->
  <g fill="#689F38" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round">
    <ellipse cx="60" cy="260" rx="20" ry="10" transform="rotate(-30 60 260)" />
    <ellipse cx="75" cy="240" rx="20" ry="10" transform="rotate(-10 75 240)" />
    <ellipse cx="190" cy="220" rx="20" ry="10" transform="rotate(30 190 220)" />
    <ellipse cx="170" cy="230" rx="20" ry="10" transform="rotate(10 170 230)" />
    <ellipse cx="80" cy="140" rx="20" ry="10" transform="rotate(-40 80 140)" />
    <ellipse cx="100" cy="150" rx="20" ry="10" transform="rotate(-20 100 150)" />
    <ellipse cx="170" cy="120" rx="20" ry="10" transform="rotate(40 170 120)" />
    <ellipse cx="150" cy="130" rx="20" ry="10" transform="rotate(20 150 130)" />
    <ellipse cx="128" cy="100" rx="20" ry="10" transform="rotate(0 128 100)" />
  </g>

  <!-- Leaf Highlights -->
  <g fill="#8BC34A">
    <ellipse cx="55" cy="255" rx="8" ry="4" transform="rotate(-30 55 255)" />
    <ellipse cx="185" cy="215" rx="8" ry="4" transform="rotate(30 185 215)" />
    <ellipse cx="75" cy="135" rx="8" ry="4" transform="rotate(-40 75 135)" />
    <ellipse cx="165" cy="115" rx="8" ry="4" transform="rotate(40 165 115)" />
  </g>

  <!-- Flower Plates (Clusters of small white circles) -->
  <g stroke="#3B2A4A" stroke-width="4">
    <!-- Plate 1 -->
    <circle cx="60" cy="230" r="8" fill="#FFFFFF" />
    <circle cx="72" cy="225" r="8" fill="#FFFFFF" />
    <circle cx="66" cy="215" r="8" fill="#FFFFFF" />
    <circle cx="54" cy="215" r="8" fill="#FFFFFF" />
    <circle cx="60" cy="222" r="8" fill="#FFFFFF" />
    
    <!-- Plate 2 -->
    <circle cx="190" cy="190" r="8" fill="#FFFFFF" />
    <circle cx="202" cy="185" r="8" fill="#FFFFFF" />
    <circle cx="196" cy="175" r="8" fill="#FFFFFF" />
    <circle cx="184" cy="175" r="8" fill="#FFFFFF" />
    <circle cx="190" cy="182" r="8" fill="#FFFFFF" />
    
    <!-- Plate 3 -->
    <circle cx="80" cy="110" r="8" fill="#FFFFFF" />
    <circle cx="92" cy="105" r="8" fill="#FFFFFF" />
    <circle cx="86" cy="95" r="8" fill="#FFFFFF" />
    <circle cx="74" cy="95" r="8" fill="#FFFFFF" />
    <circle cx="80" cy="102" r="8" fill="#FFFFFF" />
    
    <!-- Plate 4 -->
    <circle cx="170" cy="90" r="8" fill="#FFFFFF" />
    <circle cx="182" cy="85" r="8" fill="#FFFFFF" />
    <circle cx="176" cy="75" r="8" fill="#FFFFFF" />
    <circle cx="164" cy="75" r="8" fill="#FFFFFF" />
    <circle cx="170" cy="82" r="8" fill="#FFFFFF" />
    
    <!-- Plate 5 (Top) -->
    <circle cx="128" cy="70" r="8" fill="#FFFFFF" />
    <circle cx="140" cy="65" r="8" fill="#FFFFFF" />
    <circle cx="134" cy="55" r="8" fill="#FFFFFF" />
    <circle cx="122" cy="55" r="8" fill="#FFFFFF" />
    <circle cx="128" cy="62" r="8" fill="#FFFFFF" />
  </g>

  <!-- Flower Centers -->
  <g fill="#FDD835">
    <circle cx="60" cy="222" r="2" />
    <circle cx="190" cy="182" r="2" />
    <circle cx="80" cy="102" r="2" />
    <circle cx="170" cy="82" r="2" />
    <circle cx="128" cy="62" r="2" />
  </g>
</svg>