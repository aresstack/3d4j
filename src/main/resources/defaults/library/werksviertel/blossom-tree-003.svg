<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Concrete Base with Industrial Rust -->
  <rect x="60" y="460" width="136" height="52" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <path d="M60 475 L90 475 L85 490 L60 490 Z" fill="#A55D4A" />
  <path d="M160 460 L196 460 L196 475 L170 475 Z" fill="#8B4513" />
  
  <!-- Weeds at the base -->
  <path d="M65 460 L60 440 L70 460 Z" fill="#7BA35B" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  <path d="M190 460 L195 445 L200 460 Z" fill="#7BA35B" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />

  <!-- Birch Trunk -->
  <path d="M115 460 L110 120 Q128 110 146 120 L141 460 Z" fill="#FDFDFD" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Black Birch Marks -->
  <line x1="112" y1="160" x2="125" y2="160" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="135" y1="190" x2="144" y2="190" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="115" y1="230" x2="130" y2="230" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="130" y1="270" x2="142" y2="270" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="118" y1="310" x2="135" y2="310" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="130" y1="350" x2="140" y2="350" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="115" y1="390" x2="128" y2="390" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <line x1="135" y1="430" x2="145" y2="430" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />

  <!-- Hanging Branches and Leaves -->
  <!-- Top Cluster -->
  <path d="M128 120 Q128 80 160 80" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <circle cx="160" cy="80" r="25" fill="#B2D3A4" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="140" cy="70" r="20" fill="#CDE3C5" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Left Mid Cluster -->
  <path d="M115 180 Q80 180 70 220" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <circle cx="70" cy="220" r="30" fill="#B2D3A4" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="85" cy="210" r="20" fill="#CDE3C5" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Right Mid Cluster -->
  <path d="M141 240 Q180 240 170 280" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <circle cx="170" cy="280" r="30" fill="#B2D3A4" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="155" cy="270" r="20" fill="#CDE3C5" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Left Low Cluster -->
  <path d="M115 300 Q60 300 50 340" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <circle cx="50" cy="340" r="30" fill="#B2D3A4" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="65" cy="330" r="20" fill="#CDE3C5" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Right Low Cluster -->
  <path d="M141 360 Q190 360 180 400" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" />
  <circle cx="180" cy="400" r="30" fill="#B2D3A4" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="165" cy="390" r="20" fill="#CDE3C5" stroke="#3B2A4A" stroke-width="8" />
</svg>