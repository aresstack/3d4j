<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Outer weathered green frame -->
  <rect x="16" y="16" width="96" height="96" rx="4" fill="#7A8B7A" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Inner dark steel frame -->
  <rect x="20" y="20" width="88" height="88" rx="2" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Glass area -->
  <rect x="24" y="24" width="80" height="80" fill="#AEE2FF" />
  
  <!-- Void where the pane is open -->
  <rect x="81" y="24" width="23" height="23" fill="#333333" />
  
  <!-- Steel grid bars -->
  <rect x="47" y="24" width="6" height="80" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <rect x="75" y="24" width="6" height="80" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <rect x="24" y="47" width="80" height="6" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <rect x="24" y="75" width="80" height="6" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- The tilted open pane -->
  <path d="M 81 24 L 104 24 L 110 40 L 87 40 Z" fill="#AEE2FF" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Rivets on the steel frame -->
  <circle cx="24" cy="24" r="3" fill="#777777" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="104" cy="24" r="3" fill="#777777" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="24" cy="104" r="3" fill="#777777" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="104" cy="104" r="3" fill="#777777" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="47" cy="24" r="3" fill="#777777" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="75" cy="24" r="3" fill="#777777" stroke="#3B2A4A" stroke-width="2" />
  
  <!-- Glass highlights -->
  <rect x="30" y="30" width="12" height="4" fill="#DDF5FF" />
  <rect x="58" y="82" width="12" height="4" fill="#DDF5FF" />
  <rect x="30" y="82" width="12" height="4" fill="#DDF5FF" />
  <rect x="88" y="28" width="8" height="4" fill="#DDF5FF" />
</svg>