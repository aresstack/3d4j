  <path d="M166 480 Q 166 512, 136 512 L 146 480 Z" fill="#FF8C8C" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Body -->
  <path d="M128 480 C 60 480, 40 350, 40 280 C 40 200, 128 180, 128 180 C 128 180, 216 200, 216 280 C 216 350, 196 480, 128 480 Z" fill="#A0A0A0" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Chest Highlight -->
  <path d="M128 460 C 80 460, 70 350, 70 300 C 70 250, 128 230, 128 230 C 128 230, 186 250, 186 300 C 186 350, 176 460, 128 460 Z" fill="#C0C0C0" />

