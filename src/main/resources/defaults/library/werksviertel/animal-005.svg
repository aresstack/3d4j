  <circle cx="112" cy="120" r="6" fill="#3B2A4A" />
  <circle cx="114" cy="117" r="2" fill="white" />

  <circle cx="146" cy="120" r="12" fill="white" stroke="#3B2A4A" stroke-width="4" />
  <circle cx="144" cy="120" r="6" fill="#3B2A4A" />
  <circle cx="146" cy="117" r="2" fill="white" />

  <!-- Beak -->
