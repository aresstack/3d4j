<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Concrete Base -->
  <rect x="40" y="470" width="176" height="42" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Industrial Steel Planter -->
  <path d="M60 470 L200 470 L190 380 L70 380 Z" fill="#A54A3A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Steel Frame/Rim -->
  <path d="M70 380 L190 380 L195 370 L65 370 Z" fill="#4A4A4A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Rivets on Planter -->
  <circle cx="75" cy="390" r="4" fill="#707070" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="181" cy="390" r="4" fill="#707070" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="75" cy="450" r="4" fill="#707070" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="181" cy="450" r="4" fill="#707070" stroke="#3B2A4A" stroke-width="2" />

  <!-- Weeds poking out of concrete -->
  <path d="M50 470 Q55 450 60 470" fill="#7BA35A" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  <path d="M200 470 Q205 455 210 470" fill="#7BA35A" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />

  <!-- Birch Trunk 1 (Left) -->
  <path d="M110 370 Q100 280 90 180" fill="none" stroke="#F0F0F0" stroke-width="16" stroke-linecap="round" />
  <path d="M110 370 Q100 280 90 180" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" />
  <!-- Bark details -->
