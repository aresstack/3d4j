  <line x1="92" y1="260" x2="102" y2="260" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  <line x1="98" y1="310" x2="108" y2="310" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />

  <!-- Birch Trunk 2 (Right) -->
  <path d="M140 370 Q150 280 160 180" fill="none" stroke="#F0F0F0" stroke-width="16" stroke-linecap="round" />
  <path d="M140 370 Q150 280 160 180" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" />
  <!-- Bark details -->
  <line x1="155" y1="210" x2="165" y2="210" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  <line x1="158" y1="250" x2="168" y2="250" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  <line x1="152" y1="300" x2="162" y2="300" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />

