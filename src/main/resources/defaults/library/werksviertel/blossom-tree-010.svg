  <circle cx="70" cy="160" r="30" fill="#A8E063" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="110" cy="150" r="35" fill="#A8E063" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="90" cy="120" r="30" fill="#A8E063" stroke="#3B2A4A" stroke-width="8" />
  <!-- Highlights -->
  <circle cx="80" cy="130" r="10" fill="#C5F08B" />
  <circle cx="100" cy="140" r="12" fill="#C5F08B" />

  <!-- Crown 2 (Right) -->
  <circle cx="140" cy="160" r="30" fill="#A8E063" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="180" cy="150" r="35" fill="#A8E063" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="160" cy="120" r="30" fill="#A8E063" stroke="#3B2A4A" stroke-width="8" />
  <!-- Highlights -->
  <circle cx="170" cy="130" r="10" fill="#C5F08B" />
