  <circle cx="114" cy="22" r="2" fill="#707070" stroke="#3B2A4A" stroke-width="1" />
  <circle cx="14" cy="110" r="2" fill="#707070" stroke="#3B2A4A" stroke-width="1" />
  <circle cx="114" cy="110" r="2" fill="#707070" stroke="#3B2A4A" stroke-width="1" />
  
  <!-- Lock/Handle -->
