  <!-- Roller Shutter Area -->
  <rect x="15" y="23" width="98" height="84" fill="#B0B0B0" stroke="#3B2A4A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Metal Slats -->
  <line x1="15" y1="33" x2="113" y2="33" stroke="#3B2A4A" stroke-width="3" stroke-linecap="round" />
  <line x1="15" y1="43" x2="113" y2="43" stroke="#3B2A4A" stroke-width="3" stroke-linecap="round" />
  <line x1="15" y1="53" x2="113" y2="53" stroke="#3B2A4A" stroke-width="3" stroke-linecap="round" />
  <line x1="15" y1="63" x2="113" y2="63" stroke="#3B2A4A" stroke-width="3" stroke-linecap="round" />
  <line x1="15" y1="73" x2="113" y2="73" stroke="#3B2A4A" stroke-width="3" stroke-linecap="round" />
  <line x1="15" y1="83" x2="113" y2="83" stroke="#3B2A4A" stroke-width="3" stroke-linecap="round" />
  <line x1="15" y1="93" x2="113" y2="93" stroke="#3B2A4A" stroke-width="3" stroke-linecap="round" />
  <line x1="15" y1="103" x2="113" y2="103" stroke="#3B2A4A" stroke-width="3" stroke-linecap="round" />
  
  <!-- Rivets on Frame -->
