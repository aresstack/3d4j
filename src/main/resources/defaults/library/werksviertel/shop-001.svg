  <!-- Industrial Weeds at the bottom -->
  <path d="M12 112 Q 15 104 18 112" fill="none" stroke="#7BA05B" stroke-width="4" stroke-linecap="round" />
  <path d="M16 112 Q 19 106 22 112" fill="none" stroke="#7BA05B" stroke-width="4" stroke-linecap="round" />
