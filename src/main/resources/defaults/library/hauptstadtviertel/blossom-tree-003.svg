<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Trunk -->
  <path d="M 110 512 L 118 240 L 138 240 L 146 512 Z" fill="#8B7355" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Canopy Base (Darker Yellow) -->
  <circle cx="128" cy="180" r="80" fill="#BDB76B" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="80" cy="210" r="60" fill="#BDB76B" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="176" cy="210" r="60" fill="#BDB76B" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="128" cy="120" r="70" fill="#BDB76B" stroke="#3B2A4A" stroke-width="8" />

  <!-- Canopy Mid (Golden Yellow) -->
  <circle cx="128" cy="160" r="60" fill="#D4AF37" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="90" cy="190" r="50" fill="#D4AF37" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="166" cy="190" r="50" fill="#D4AF37" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="128" cy="100" r="50" fill="#D4AF37" stroke="#3B2A4A" stroke-width="8" />

  <!-- Canopy Highlights (Pale Yellow) -->
  <circle cx="110" cy="140" r="30" fill="#EEDC82" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="150" cy="170" r="30" fill="#EEDC82" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="128" cy="80" r="30" fill="#EEDC82" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="80" cy="160" r="30" fill="#EEDC82" stroke="#3B2A4A" stroke-width="8" />

  <!-- Poster on Trunk -->
  <path d="M 116 310 L 140 310 L 142 380 L 114 380 Z" fill="#F5F5DC" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <!-- Poster Details (Abstract Graphics) -->
  <rect x="120" y="320" width="20" height="6" fill="#FF6B6B" />
  <rect x="120" y="330" width="12" height="4" fill="#4ECDC4" />
  <rect x="120" y="340" width="18" height="4" fill="#FF6B6B" />
  <path d="M 120 350 L 135 350 L 130 360 L 120 360 Z" fill="#4ECDC4" />
  <!-- Peeling corner of poster -->
  <path d="M 140 310 L 145 315 L 142 320 Z" fill="#DCDCDC" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />

  <!-- Fallen Leaves at Base -->
  <ellipse cx="100" cy="505" rx="12" ry="8" fill="#D4AF37" stroke="#3B2A4A" stroke-width="6" />
  <ellipse cx="155" cy="508" rx="12" ry="8" fill="#EEDC82" stroke="#3B2A4A" stroke-width="6" />
  <ellipse cx="130" cy="512" rx="12" ry="8" fill="#BDB76B" stroke="#3B2A4A" stroke-width="6" />
</svg>