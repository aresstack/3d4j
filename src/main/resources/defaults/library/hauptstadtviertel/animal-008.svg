<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Legs/Feet -->
  <ellipse cx="70" cy="480" rx="45" ry="30" fill="#966F33" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <ellipse cx="186" cy="480" rx="45" ry="30" fill="#966F33" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Body -->
  <ellipse cx="128" cy="340" rx="85" ry="130" fill="#966F33" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Belly -->
  <ellipse cx="128" cy="360" rx="55" ry="80" fill="#D2B48C" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Left Arm (Resting) -->
  <path d="M 60 300 Q 40 340 70 380" fill="none" stroke="#966F33" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 60 300 Q 40 340 70 380" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Arm (Waving) -->
  <path d="M 196 300 Q 230 260 210 180" fill="none" stroke="#966F33" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 196 300 Q 230 260 210 180" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Paw -->
  <circle cx="210" cy="160" r="25" fill="#966F33" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <circle cx="210" cy="150" r="10" fill="#D2B48C" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />

  <!-- Head -->
  <circle cx="128" cy="170" r="65" fill="#966F33" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Ears -->
  <circle cx="75" cy="120" r="22" fill="#966F33" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <circle cx="181" cy="120" r="22" fill="#966F33" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <circle cx="75" cy="120" r="12" fill="#D2B48C" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <circle cx="181" cy="120" r="12" fill="#D2B48C" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />

  <!-- Muzzle -->
  <ellipse cx="128" cy="190" rx="32" ry="22" fill="#D2B48C" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Nose -->
  <ellipse cx="128" cy="185" rx="10" ry="6" fill="#3B2A4A" />
  
  <!-- Eyes -->
  <circle cx="110" cy="160" r="6" fill="#3B2A4A" />
  <circle cx="146" cy="160" r="6" fill="#3B2A4A" />
  
  <!-- Highlights -->
  <path d="M 100 140 Q 110 130 120 140" fill="none" stroke="#B89B72" stroke-width="6" stroke-linecap="round" />
  <path d="M 140 140 Q 150 130 160 140" fill="none" stroke="#B89B72" stroke-width="6" stroke-linecap="round" />
</svg>