  <circle cx="25" cy="58" r="2" fill="#AEEEEE" />
  <circle cx="40" cy="55" r="6" fill="#FFB6C1" stroke="#3B2A4A" stroke-width="2" />
  <circle cx="40" cy="55" r="2" fill="#AEEEEE" />
  
