<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Awning -->
  <rect x="10" y="18" width="108" height="18" rx="4" fill="#FFB347" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <line x1="30" y1="18" x2="30" y2="36" stroke="#3B2A4A" stroke-width="4" />
  <line x1="54" y1="18" x2="54" y2="36" stroke="#3B2A4A" stroke-width="4" />
  <line x1="78" y1="18" x2="78" y2="36" stroke="#3B2A4A" stroke-width="4" />
  <line x1="102" y1="18" x2="102" y2="36" stroke="#3B2A4A" stroke-width="4" />

  <!-- Main Shop Frame -->
  <rect x="14" y="36" width="100" height="76" fill="#FDF5E6" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />

  <!-- Window Area -->
  <rect x="18" y="42" width="48" height="48" fill="#BEE3F8" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- The Kebab Spit (Doner) -->
  <rect x="40" y="45" width="4" height="40" fill="#8B4513" stroke="#3B2A4A" stroke-width="2" />
  <path d="M32 48 Q42 45 52 48 L50 80 Q42 83 34 80 Z" fill="#A0522D" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <!-- Meat texture lines -->
  <line x1="35" y1="55" x2="49" y2="53" stroke="#3B2A4A" stroke-width="2" opacity="0.5" />
  <line x1="36" y1="65" x2="48" y2="63" stroke="#3B2A4A" stroke-width="2" opacity="0.5" />
  <line x1="37" y1="75" x2="47" y2="73" stroke="#3B2A4A" stroke-width="2" opacity="0.5" />

  <!-- Counter -->
  <rect x="18" y="90" width="48" height="22" fill="#E0E0E0" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />

  <!-- Door -->
  <rect x="70" y="42" width="38" height="70" fill="#BEE3F8" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" />
  <circle cx="82" cy="77" r="3" fill="#3B2A4A" />

  <!-- Glass Highlights -->
  <line x1="22" y1="46" x2="30" y2="54" stroke="white" stroke-width="3" stroke-linecap="round" />
  <line x1="26" y1="46" x2="34" y2="54" stroke="white" stroke-width="3" stroke-linecap="round" />
  <line x1="74" y1="46" x2="82" y2="54" stroke="white" stroke-width="3" stroke-linecap="round" />

  <!-- Small Details (Graffiti/Poster) -->
  <path d="M105 95 Q108 92 111 95 T115 95" fill="none" stroke="#FF69B4" stroke-width="3" stroke-linecap="round" />
  <rect x="102" y="75" width="8" height="12" fill="#FFD700" stroke="#3B2A4A" stroke-width="2" />
</svg>