<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Window Frame -->
  <rect x="20" y="20" width="88" height="88" fill="#FDF5E6" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  
  <!-- Glass Panes -->
  <rect x="25" y="25" width="38" height="78" fill="#B0E2FF" stroke="#3B2A4A" stroke-width="4" rx="1" stroke-linejoin="round" />
  <rect x="65" y="25" width="38" height="78" fill="#B0E2FF" stroke="#3B2A4A" stroke-width="4" rx="1" stroke-linejoin="round" />
  
  <!-- Glass Highlights -->
  <path d="M30 30 L40 30 L30 50 Z" fill="#E0F7FF" />
  <path d="M70 30 L80 30 L70 50 Z" fill="#E0F7FF" />
  
  <!-- Stone Balcony Base -->
  <rect x="15" y="85" width="98" height="18" fill="#D3D3D3" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  <!-- Weathering detail on stone -->
  <rect x="20" y="95" width="10" height="3" fill="#BDBDBD" />
  <rect x="90" y="90" width="8" height="3" fill="#BDBDBD" />
  
  <!-- Iron Railing -->
  <!-- Top Rail -->
  <rect x="15" y="65" width="98" height="4" fill="#3B2A4A" stroke="#3B2A4A" stroke-width="4" rx="2" />
  <!-- Bottom Rail -->
  <rect x="15" y="81" width="98" height="4" fill="#3B2A4A" stroke="#3B2A4A" stroke-width="4" rx="2" />
  <!-- Vertical Bars -->
  <line x1="25" y1="65" x2="25" y2="85" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  <line x1="35" y1="65" x2="35" y2="85" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  <line x1="45" y1="65" x2="45" y2="85" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  <line x1="55" y1="65" x2="55" y2="85" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  <line x1="65" y1="65" x2="65" y2="85" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  <line x1="75" y1="65" x2="75" y2="85" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  <line x1="85" y1="65" x2="85" y2="85" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  <line x1="95" y1="65" x2="95" y2="85" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
  <line x1="105" y1="65" x2="105" y2="85" stroke="#3B2A4A" stroke-width="4" stroke-linecap="round" />
</svg>