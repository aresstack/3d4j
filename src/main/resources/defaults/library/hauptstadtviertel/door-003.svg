<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Door Frame -->
  <rect x="34" y="18" width="60" height="110" fill="#A0A0A0" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" rx="2" />
  
  <!-- Glass Pane -->
  <rect x="38" y="22" width="52" height="102" fill="#BDE0FF" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" rx="2" />
  
  <!-- Glass Highlights -->
  <path d="M45 30 L60 45" stroke="white" stroke-width="4" stroke-linecap="round" />
  <path d="M50 80 L65 95" stroke="white" stroke-width="4" stroke-linecap="round" />
  
  <!-- Door Handle -->
  <rect x="88" y="60" width="6" height="15" fill="#D0D0D0" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" rx="2" />
  
  <!-- Letterbox Panel -->
  <rect x="96" y="40" width="20" height="88" fill="#C0C0C0" stroke="#3B2A4A" stroke-width="4" stroke-linejoin="round" rx="2" />
  
  <!-- Individual Letterboxes -->
  <rect x="98" y="44" width="16" height="12" fill="#808080" stroke="#3B2A4A" stroke-width="3" stroke-linejoin="round" rx="1" />
  <rect x="98" y="60" width="16" height="12" fill="#808080" stroke="#3B2A4A" stroke-width="3" stroke-linejoin="round" rx="1" />
  <rect x="98" y="76" width="16" height="12" fill="#808080" stroke="#3B2A4A" stroke-width="3" stroke-linejoin="round" rx="1" />
  <rect x="98" y="92" width="16" height="12" fill="#808080" stroke="#3B2A4A" stroke-width="3" stroke-linejoin="round" rx="1" />
  
  <!-- Small Graffiti/Sticker on panel -->
  <rect x="100" y="108" width="12" height="8" fill="#FF6B6B" stroke="#3B2A4A" stroke-width="2" stroke-linejoin="round" rx="1" />
</svg>