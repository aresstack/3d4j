  <ellipse cx="186" cy="480" rx="45" ry="30" fill="#966F33" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Body -->
  <ellipse cx="128" cy="380" rx="85" ry="120" fill="#966F33" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
