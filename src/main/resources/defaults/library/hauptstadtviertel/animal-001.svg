  <ellipse cx="128" cy="400" rx="55" ry="80" fill="#D2B48C" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Left Arm (Resting) -->
  <path d="M 60 320 Q 40 360 70 400" fill="none" stroke="#966F33" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 60 320 Q 40 360 70 400" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Arm (Waving) -->
  <path d="M 196 320 Q 230 250 210 160" fill="none" stroke="#966F33" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 196 320 Q 230 250 210 160" fill="none" stroke="#3B2A4A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Head -->
  <circle cx="128" cy="180" r="75" fill="#966F33" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Ears -->
  <circle cx="65" cy="120" r="25" fill="#966F33" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <circle cx="191" cy="120" r="25" fill="#966F33" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <circle cx="65" cy="120" r="12" fill="#D2B48C" />
  <circle cx="191" cy="120" r="12" fill="#D2B48C" />
  
  <!-- Muzzle -->
  <ellipse cx="128" cy="210" rx="35" ry="28" fill="#D2B48C" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Nose -->
