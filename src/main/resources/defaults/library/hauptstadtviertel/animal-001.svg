  <path d="M 120 220 Q 128 235 136 220" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Eyes -->
  <circle cx="110" cy="170" r="7" fill="#3B2A4A" />
  <circle cx="146" cy="170" r="7" fill="#3B2A4A" />
  
  <!-- Highlights -->
  <path d="M 100 150 Q 110 140 120 150" fill="none" stroke="#B88B5A" stroke-width="6" stroke-linecap="round" />
  <path d="M 160 350 Q 170 340 180 350" fill="none" stroke="#B88B5A" stroke-width="6" stroke-linecap="round" />
