<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Feet -->
  <path d="M100 440 L80 480 L110 480 L120 440 Z" fill="#FFB347" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <path d="M156 440 L146 480 L176 480 L166 440 Z" fill="#FFB347" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <path d="M90 480 L70 512 L110 512 L110 480" fill="#FFB347" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <path d="M166 480 L156 512 L196 512 L176 480" fill="#FFB347" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Body -->
  <ellipse cx="128" cy="340" rx="75" ry="110" fill="#A0A0A0" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Wings -->
  <ellipse cx="70" cy="340" rx="30" ry="70" fill="#808080" stroke="#3B2A4A" stroke-width="8" />
  <ellipse cx="186" cy="340" rx="30" ry="70" fill="#808080" stroke="#3B2A4A" stroke-width="8" />

  <!-- Neck -->
  <rect x="98" y="210" width="60" height="70" rx="30" fill="#A0A0A0" stroke="#3B2A4A" stroke-width="8" />

  <!-- Head -->
  <circle cx="128" cy="160" r="55" fill="#A0A0A0" stroke="#3B2A4A" stroke-width="8" />

  <!-- Beak -->
  <path d="M120 170 L136 170 L128 200 Z" fill="#FFB347" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Eyes -->
  <circle cx="110" cy="150" r="12" fill="white" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="110" cy="150" r="5" fill="#3B2A4A" />
  
  <circle cx="146" cy="150" r="12" fill="white" stroke="#3B2A4A" stroke-width="6" />
  <circle cx="146" cy="150" r="5" fill="#3B2A4A" />

  <!-- Highlights -->
  <path d="M110 130 Q128 120 146 130" fill="none" stroke="#C0C0C0" stroke-width="8" stroke-linecap="round" />
  <ellipse cx="128" cy="360" rx="30" ry="50" fill="#C0C0C0" opacity="0.5" />
