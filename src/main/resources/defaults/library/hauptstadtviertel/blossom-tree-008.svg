  <!-- Wooden Stakes -->
  <rect x="60" y="220" width="18" height="280" rx="4" fill="#D2B48C" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="180" y="220" width="18" height="280" rx="4" fill="#D2B48C" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Graffiti on stake -->
  <path d="M184 350 q 4 -5 8 0 t 8 0" fill="none" stroke="#FF69B4" stroke-width="4" stroke-linecap="round" />
  <path d="M184 360 q 4 -5 8 0 t 8 0" fill="none" stroke="#00FFFF" stroke-width="4" stroke-linecap="round" />

  <!-- Tree Trunk -->
  <path d="M120 500 L124 250 Q128 230 132 250 L136 500 Z" fill="#BCAAA4" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

