  <path d="M80 170 Q87 160 92 170 Q92 180 80 190 Q68 180 68 170 Q73 160 80 170" fill="#A8D5BA" stroke="#3B2A4A" stroke-width="6" />
  <path d="M176 170 Q183 160 188 170 Q188 180 176 190 Q164 180 164 170 Q169 160 176 170" fill="#A8D5BA" stroke="#3B2A4A" stroke-width="6" />
