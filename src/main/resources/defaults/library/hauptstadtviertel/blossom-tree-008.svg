  <circle cx="90" cy="210" r="50" fill="#8DBE9C" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="166" cy="210" r="50" fill="#8DBE9C" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="128" cy="230" r="60" fill="#8DBE9C" stroke="#3B2A4A" stroke-width="8" />
  
  <!-- Lighter highlights -->
  <circle cx="110" cy="160" r="30" fill="#A8D5BA" />
  <circle cx="145" cy="170" r="25" fill="#A8D5BA" />
  <circle cx="100" cy="200" r="20" fill="#A8D5BA" />
  <circle cx="150" cy="220" r="20" fill="#A8D5BA" />

