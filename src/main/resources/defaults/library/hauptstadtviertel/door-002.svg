<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Main Door Body -->
  <rect x="32" y="16" width="64" height="112" fill="#7A4A21" stroke="#3B2A4A" stroke-width="5" rx="2" />
  
  <!-- Door Panels for "Heavy" look -->
  <rect x="38" y="24" width="24" height="36" fill="#5D3A1A" stroke="#3B2A4A" stroke-width="4" rx="2" />
  <rect x="66" y="24" width="24" height="36" fill="#5D3A1A" stroke="#3B2A4A" stroke-width="4" rx="2" />
  <rect x="38" y="68" width="24" height="36" fill="#5D3A1A" stroke="#3B2A4A" stroke-width="4" rx="2" />
  <rect x="66" y="68" width="24" height="36" fill="#5D3A1A" stroke="#3B2A4A" stroke-width="4" rx="2" />
  
  <!-- Door Handle -->
  <circle cx="90" cy="64" r="4" fill="#FFD700" stroke="#3B2A4A" stroke-width="3" />
  
  <!-- Stickers -->
  <rect x="36" y="30" width="12" height="12" fill="#FF4D4D" stroke="#3B2A4A" stroke-width="3" rx="1" />
  <circle cx="80" cy="45" r="6" fill="#00FFFF" stroke="#3B2A4A" stroke-width="3" />
  <rect x="72" y="80" width="15" height="10" fill="#FFD700" stroke="#3B2A4A" stroke-width="3" rx="1" />
  <rect x="40" y="100" width="10" height="14" fill="#32CD32" stroke="#3B2A4A" stroke-width="3" rx="1" />
  <circle cx="60" cy="110" r="5" fill="#FF69B4" stroke="#3B2A4A" stroke-width="3" />
  
  <!-- Graffiti Tags -->
  <path d="M 45 62 Q 55 55 65 62 T 85 62" fill="none" stroke="#B026FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 50 65 Q 55 75 60 65" fill="none" stroke="#B026FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 75 100 L 80 105 L 85 100" fill="none" stroke="#B026FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>