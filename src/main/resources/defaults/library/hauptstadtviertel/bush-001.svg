<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
  <!-- Main Column Body -->
  <rect x="64" y="100" width="128" height="412" fill="#E0E0D1" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Pointed Roof -->
  <path d="M56 100 L128 40 L200 100 Z" fill="#7A6B5D" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />
  <rect x="56" y="90" width="144" height="15" fill="#7A6B5D" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round" />

  <!-- Posters (Layered) -->
  <!-- Poster 1: Yellow -->
  <rect x="72" y="120" width="50" height="80" fill="#FFD966" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" transform="rotate(-2 97 160)" />
  
  <!-- Poster 2: Blue -->
  <rect x="110" y="130" width="60" height="100" fill="#87CEEB" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" transform="rotate(3 140 180)" />
  
  <!-- Poster 3: Pink (Torn) -->
  <path d="M75 210 L145 210 L145 300 L110 310 L75 290 Z" fill="#FFB6C1" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Poster 4: Green -->
  <rect x="130" y="240" width="50" height="70" fill="#90EE90" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" transform="rotate(-1 155 275)" />
  
  <!-- Poster 5: Orange -->
  <rect x="85" y="320" width="80" height="110" fill="#FFB347" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" transform="rotate(1 125 375)" />
  
  <!-- Poster 6: Purple (Small/Torn) -->
  <path d="M140 330 L180 330 L180 380 L135 370 Z" fill="#DDA0DD" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Poster 7: Pale Blue (Bottom) -->
  <rect x="70" y="440" width="110" height="60" fill="#B0E0E6" stroke="#3B2A4A" stroke-width="6" stroke-linejoin="round" transform="rotate(-1 125 470)" />

  <!-- Graffiti Scribbles -->
  <path d="M160 410 Q170 400 180 410 T190 410" fill="none" stroke="#FF00FF" stroke-width="4" stroke-linecap="round" />
  <path d="M70 310 Q80 300 90 310" fill="none" stroke="#00FF00" stroke-width="4" stroke-linecap="round" />
  <path d="M110 450 L120 460 L110 470" fill="none" stroke="#FF0000" stroke-width="4" stroke-linecap="round" />

  <!-- Highlights -->
  <rect x="75" y="125" width="10" height="30" fill="#FFFFFF" fill-opacity="0.4" />
  <rect x="115" y="135" width="10" height="40" fill="#FFFFFF" fill-opacity="0.4" />
  <rect x="90" y="325" width="15" height="50" fill="#FFFFFF" fill-opacity="0.4" />
</svg>