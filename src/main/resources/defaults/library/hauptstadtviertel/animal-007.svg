  <!-- Ears -->
  <circle cx="65" cy="110" r="25" fill="#966F33" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="191" cy="110" r="25" fill="#966F33" stroke="#3B2A4A" stroke-width="8" />
  <circle cx="65" cy="110" r="12" fill="#D2B48C" />
