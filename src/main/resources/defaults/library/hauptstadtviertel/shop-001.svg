<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Shop Frame -->
  <rect x="10" y="32" width="108" height="76" fill="#B0BEC5" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  
  <!-- Glowing Sign Board -->
  <rect x="14" y="20" width="100" height="12" fill="#FFF59D" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  <rect x="18" y="22" width="92" height="8" fill="#FFFFFF" stroke="none" />
  
  <!-- Shop Window -->
  <rect x="14" y="36" width="50" height="72" fill="#B3E5FC" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  
  <!-- Shop Door -->
  <rect x="64" y="36" width="44" height="72" fill="#B3E5FC" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  <rect x="102" y="65" width="4" height="10" fill="#3B2A4A" rx="2" />
  
  <!-- Glass Highlights -->
  <path d="M 20 45 L 30 55 M 20 55 L 30 65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 70 45 L 80 55 M 70 55 L 80 65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
  
  <!-- Graffiti on frame -->
  <path d="M 64 100 Q 68 95 72 100 T 76 100" stroke="#F06292" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Crates of Bottles -->
  <!-- Crate 1 (Bottom Left) -->
  <rect x="14" y="95" width="20" height="15" fill="#EF5350" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  <rect x="16" y="97" width="4" height="10" fill="#5D4037" stroke="none" />
  <rect x="22" y="97" width="4" height="10" fill="#5D4037" stroke="none" />
  <rect x="28" y="97" width="4" height="10" fill="#5D4037" stroke="none" />
  
  <!-- Crate 2 (Bottom Mid) -->
  <rect x="34" y="95" width="20" height="15" fill="#81C784" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  <rect x="36" y="97" width="4" height="10" fill="#388E3C" stroke="none" />
  <rect x="42" y="97" width="4" height="10" fill="#388E3C" stroke="none" />
  <rect x="48" y="97" width="4" height="10" fill="#388E3C" stroke="none" />
  
  <!-- Crate 3 (Stacked Left) -->
  <rect x="14" y="80" width="20" height="15" fill="#EF5350" stroke="#3B2A4A" stroke-width="4" rx="2" stroke-linejoin="round" />
  <rect x="16" y="82" width="4" height="10" fill="#5D4037" stroke="none" />
  <rect x="22" y="82" width="4" height="10" fill="#5D4037" stroke="none" />
  <rect x="28" y="82" width="4" height="10" fill="#5D4037" stroke="none" />
</svg>