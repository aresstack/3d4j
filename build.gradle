plugins {
    id 'java'
}

group = 'com.aresstack'
version = '0.1.0-SNAPSHOT'

// The FFM API is a preview API in Java 21. Preview class files only run on the
// exact Java version they were compiled for, so the toolchain is pinned to 21.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    // The launcher is compiled WITHOUT --enable-preview so that a plain
    // "java -jar 3d4j.jar" can load it. It then restarts the JVM with the flag.
    launcher {
        java {
            srcDir 'src/launcher/java'
        }
    }
}

// Libraries are welcome as long as they are written in Java only (no native code).
dependencies {
    // SVG to image, for artwork that arrives as SVG text
    implementation 'org.apache.xmlgraphics:batik-bridge:1.17'
    implementation 'org.apache.xmlgraphics:batik-anim:1.17'
    // WebSocket for the KeePassRPC code copied from enterprise-ai-client (see its UPSTREAM.md)
    implementation 'org.java-websocket:Java-WebSocket:1.5.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    // Way through the company proxy (PAC script of Windows, evaluated with GraalJS), as in the
    // Enterprise AI Client and Space Harvester
    implementation 'com.aresstack:win-proxy-java:0.2.0'
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Engine and demo (source set "main") use the FFM preview API.
tasks.named('compileJava') {
    options.compilerArgs += ['--enable-preview', '-Xlint:-preview']
}

tasks.named('compileTestJava') {
    options.compilerArgs += ['--enable-preview', '-Xlint:-preview']
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-preview', '--enable-native-access=ALL-UNNAMED', '-Djava.awt.headless=true'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

def engineJvmArgs = ['--enable-preview', '--enable-native-access=ALL-UNNAMED']
def launcherClass = 'com.aresstack.threed4j.launcher.Launcher'
def demoClass = 'com.aresstack.threed4j.demo.PlazaDemo'

// ServiceLoader files (META-INF/services/*) exist in several library JARs under the same name:
// GraalJS registers its languages (JavaScript, regular expressions) that way. Copying the JARs
// together would keep only the first file of each name, so the lists are merged here, as the
// fat JAR of the Enterprise AI Client does.
def runtimeJars = configurations.runtimeClasspath.filter { it.name.endsWith('.jar') }
def mergedServicesDir = layout.buildDirectory.dir('merged-services')
def mergeServices = tasks.register('mergeServices') {
    inputs.files(runtimeJars)
    outputs.dir(mergedServicesDir)
    doLast {
        def prefix = 'META-INF/services/'
        Map<String, Set<String>> providers = new TreeMap<String, Set<String>>()
        runtimeJars.files.each { File jar ->
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                Collections.list(zip.entries()).each { entry ->
                    String name = entry.name
                    if (!entry.directory && name.startsWith(prefix) && name.indexOf('/', prefix.length()) < 0) {
                        zip.getInputStream(entry).withCloseable { input ->
                            def lines = input.getText('UTF-8').readLines()
                                    .collect { it.replaceFirst('#.*$', '').trim() }.findAll { !it.isEmpty() }
                            providers.computeIfAbsent(name.substring(prefix.length())) { new LinkedHashSet<String>() }
                                    .addAll(lines)
                        }
                    }
                }
            }
        }
        File root = mergedServicesDir.get().asFile
        root.deleteDir()
        File target = new File(root, prefix)
        target.mkdirs()
        providers.each { String service, Set<String> lines ->
            new File(target, service).setText(lines.join('\n') + '\n', 'UTF-8')
        }
    }
}

// One runnable JAR: launcher classes (no preview), engine classes (preview) and all libraries.
tasks.named('jar') {
    dependsOn mergeServices
    archiveFileName = '3d4j.jar'
    from sourceSets.launcher.output
    from mergedServicesDir
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // The merged service lists come first; the copies inside the library JARs are skipped as duplicates.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Signatures of the library JARs do not match the combined JAR.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class',
            'META-INF/versions/*/module-info.class'
    manifest {
        attributes(
                'Main-Class': launcherClass,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Multi-Release': 'true'
        )
    }
}

// Starts the demo directly with the preview flags. Use this (or an equivalent
// IDE run configuration) for debugging, because no second JVM is involved.
tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Runs the plaza demo directly with --enable-preview.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = demoClass
    jvmArgs = engineJvmArgs
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

// Starts the launcher the same way "java -jar build/libs/3d4j.jar" does.
tasks.register('runJar', JavaExec) {
    group = 'application'
    description = 'Runs the JAR through the self-relaunching launcher.'
    dependsOn tasks.named('jar')
    classpath = files(tasks.named('jar'))
    mainClass = launcherClass
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
