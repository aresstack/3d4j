plugins {
    id 'java'
}

group = 'com.aresstack'
version = '0.1.0-SNAPSHOT'

// The FFM API is a preview API in Java 21. Preview class files only run on the
// exact Java version they were compiled for, so the toolchain is pinned to 21.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    // The launcher is compiled WITHOUT --enable-preview so that a plain
    // "java -jar 3d4j.jar" can load it. It then restarts the JVM with the flag.
    launcher {
        java {
            srcDir 'src/launcher/java'
        }
    }
}

// Libraries are welcome as long as they are written in Java only (no native code).
dependencies {
    // SVG to image, for artwork that arrives as SVG text
    implementation 'org.apache.xmlgraphics:batik-bridge:1.17'
    implementation 'org.apache.xmlgraphics:batik-anim:1.17'
    // API key from KeePass (KeePassRPC plugin); brings Gson and Java-WebSocket
    implementation 'com.aresstack:keepassrpc-java:0.1.0-beta.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Engine and demo (source set "main") use the FFM preview API.
tasks.named('compileJava') {
    options.compilerArgs += ['--enable-preview', '-Xlint:-preview']
}

tasks.named('compileTestJava') {
    options.compilerArgs += ['--enable-preview', '-Xlint:-preview']
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-preview', '--enable-native-access=ALL-UNNAMED', '-Djava.awt.headless=true'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

def engineJvmArgs = ['--enable-preview', '--enable-native-access=ALL-UNNAMED']
def launcherClass = 'com.aresstack.threed4j.launcher.Launcher'
def demoClass = 'com.aresstack.threed4j.demo.PlazaDemo'

// One runnable JAR: launcher classes (no preview), engine classes (preview) and all libraries.
tasks.named('jar') {
    archiveFileName = '3d4j.jar'
    from sourceSets.launcher.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Signatures of the library JARs do not match the combined JAR.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class',
            'META-INF/versions/*/module-info.class'
    manifest {
        attributes(
                'Main-Class': launcherClass,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}

// Starts the demo directly with the preview flags. Use this (or an equivalent
// IDE run configuration) for debugging, because no second JVM is involved.
tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Runs the plaza demo directly with --enable-preview.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = demoClass
    jvmArgs = engineJvmArgs
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

// Starts the launcher the same way "java -jar build/libs/3d4j.jar" does.
tasks.register('runJar', JavaExec) {
    group = 'application'
    description = 'Runs the JAR through the self-relaunching launcher.'
    dependsOn tasks.named('jar')
    classpath = files(tasks.named('jar'))
    mainClass = launcherClass
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
